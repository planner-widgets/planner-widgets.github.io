*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#141220}
body{font-family:Vz,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-weight:500;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.w{position:relative;width:100%;height:100%;min-height:150px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse 70% 90% at 0% 100%,rgba(124,108,240,.34),rgba(124,108,240,0) 70%),radial-gradient(ellipse 60% 80% at 100% 0%,rgba(205,150,198,.24),rgba(205,150,198,0) 70%),#141220;border:1px solid rgba(255,255,255,.1)}
.w{justify-content:flex-start;padding:14px 14px 12px}
.h{display:flex;align-items:baseline;justify-content:center;gap:.5em;width:100%;padding:0 6px 8px}
.m{font-weight:800;font-size:19px;font-size:clamp(16px,5.2vw,23px);color:#f3eeff}
.y{font-size:14px;font-size:clamp(12px,3.9vw,17px);color:#b9add6}
.s{display:block;width:100%;height:2px;flex:none;margin-bottom:8px;border-radius:2px;background:linear-gradient(to right,rgba(124,124,242,0),#7c7cf2 25%,#eeaede 50%,#7c7cf2 75%,rgba(124,124,242,0))}
.k{display:grid;grid-template-columns:repeat(7,1fr);width:100%;flex:1;align-items:center;justify-items:center;row-gap:2px}
.k span{display:flex;align-items:center;justify-content:center;width:2.1em;height:2.1em;border-radius:50%;font-size:15px;font-size:clamp(12px,4.1vw,18px);color:rgba(255,255,255,.84)}
.k .n{font-size:13px;font-size:clamp(11px,3.5vw,15px);color:#9d92bd;height:1.7em}
.k .f{color:#e7b7de}
.k .t{font-weight:800;color:#fff;background:linear-gradient(135deg,#7c7cf2 0%,#a78bfa 55%,#eeaede 100%);box-shadow:0 0 14px rgba(167,139,250,.6)}
</style>
</head>
<body>
<div class="w"><div class="h"><span class="m" id="m">&nbsp;</span><span class="y" id="y">&nbsp;</span></div><i class="s"></i><div class="k" id="k"></div></div>
<script>
(function(){

function g2j(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334],gy2=gm>2?gy+1:gy,
days=355666+365*gy+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g[gm-1],jy=-1595+33*~~(days/12053);
days%=12053;jy+=4*~~(days/1461);days%=1461;if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}
return days<186?[jy,1+~~(days/31),1+days%31]:[jy,7+~~((days-186)/30),1+(days-186)%30]}
function jal(d){return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())}
var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var DAYS=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
function fa(n){return String(n).replace(/[0-9]/g,function(c){return '۰۱۲۳۴۵۶۷۸۹'.charAt(c)})}
function two(n){return (n<10?'0':'')+n}
function shift(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function monthLength(d,j){var n=j[2],x=shift(d,0);for(var i=0;i<32;i++){x.setDate(x.getDate()+1);if(jal(x)[1]!==j[1])break;n++}return n}

var NAMES=['ش','ی','د','س','چ','پ','ج'];
function draw(){var d=new Date(),j=jal(d),first=shift(d,1-j[2]),lead=(first.getDay()+1)%7,len=monthLength(d,j),h='',i;
document.getElementById('m').textContent=MONTHS[j[1]-1];document.getElementById('y').textContent=fa(j[0]);
for(i=0;i<7;i++)h+='<span class="n'+(i===6?' f':'')+'">'+NAMES[i]+'</span>';
for(i=0;i<lead;i++)h+='<span></span>';
for(i=1;i<=len;i++)h+='<span class="'+(i===j[2]?'t':(lead+i-1)%7===6?'f':'')+'">'+fa(i)+'</span>';
document.getElementById('k').innerHTML=h;
var next=shift(d,1);setTimeout(draw,next.getTime()-d.getTime()+1000)}
draw();
})();
</script>
